<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Lost & Found</title>

    <!-- Global Theme -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .section-title {
            font-size: 26px;
            font-weight: 700;
            margin-left: 25px;
            margin-top: 30px;
            color: #1B1F3B;
        }

        .item-card {
            background: #FFFFFF;
            padding: 18px;
            border-radius: 18px;
            width: 280px;
            box-shadow: 0px 4px 14px rgba(0,0,0,0.12);
            transition: 0.25s;
        }

        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0px 8px 22px rgba(0,0,0,0.16);
        }

        .item-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .item-info {
            font-size: 14px;
            margin-top: 6px;
            color: #444A6A;
        }

        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
        }

        .popup-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div>Admin Dashboard</div>
        <button class="nav-btn" onclick="logout()">Logout</button>
    </div>

    <!-- NOT RETURNED ITEMS -->
    <h2 class="section-title">Not Returned Items</h2>
    <div id="notReturnedContainer" class="grid"></div>

    <!-- RETURNED ITEMS -->
    <h2 class="section-title">Returned Items</h2>
    <div id="returnedContainer" class="grid"></div>


    <!-- POPUP EDIT MODAL -->
    <div id="popupOverlay" class="overlay">
        <div class="popup-box">
            <div class="popup-title">Edit Item</div>

            <input id="editName" placeholder="Item Name">
            <textarea id="editDesc" placeholder="Description"></textarea>

            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="saveEdit()">
                Save Changes
            </button>
        </div>
    </div>


    <script>
        let CURRENT_EDIT_ID = null;

        async function loadItems() {
            const res = await fetch("http://localhost:3000/admin/items");
            const items = await res.json();

            const notReturned = items.filter(i => !i.returned);
            const returned = items.filter(i => i.returned);

            renderItems(notReturned, "notReturnedContainer");
            renderItems(returned, "returnedContainer");
        }

        function renderItems(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            list.forEach(item => {
                container.innerHTML += `
                    <div class="item-card">
                        ${item.image_url ? `<img src="http://localhost:3000${item.image_url}" class="item-img">` : ""}

                        <h3>${item.item_name}</h3>
                        <div class="item-info"><b>Location:</b> ${item.location_found}</div>
                        <div class="item-info"><b>Description:</b> ${item.description || "None"}</div>
                        <div class="item-info"><b>Finder:</b> ${item.finder_email} | ${item.finder_phone}</div>

                        <div class="btn-row">
                            <button class="btn btn-primary" style="font-size: 13px;" onclick="openEdit('${item._id}', '${item.item_name}', \`${item.description || ""}\`)">Edit</button>
                            <button class="btn btn-success" style="font-size: 13px;" onclick="markReturned('${item._id}')">Return</button>
                            <button class="btn btn-danger" style="font-size: 13px;" onclick="deleteItem('${item._id}')">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        async function deleteItem(id) {
            await fetch(`http://localhost:3000/admin/items/${id}`, {
                method: "DELETE"
            });
            loadItems();
        }

        async function markReturned(id) {
            await fetch(`http://localhost:3000/admin/items/return/${id}`, {
                method: "PATCH"
            });
            loadItems();
        }

        function openEdit(id, name, desc) {
            CURRENT_EDIT_ID = id;

            document.getElementById("editName").value = name;
            document.getElementById("editDesc").value = desc;

            document.getElementById("popupOverlay").style.display = "flex";
        }

        async function saveEdit() {
            const newName = document.getElementById("editName").value;
            const newDesc = document.getElementById("editDesc").value;

            await fetch(`http://localhost:3000/admin/items/${CURRENT_EDIT_ID}`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ item_name: newName, description: newDesc })
            });

            document.getElementById("popupOverlay").style.display = "none";
            loadItems();
        }

        function logout() {
            window.location.href = "UserAdmin.html";
        }

        loadItems();
    </script>

</body>
</html>
