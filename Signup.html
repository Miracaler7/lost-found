<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Page</title>

  <!-- Global Theme -->
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .logo {
      width: 130px;
      margin-bottom: 10px;
    }

    .signup-box {
      background: white;
      width: 420px;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0px 4px 18px rgba(0,0,0,0.12);
      text-align: center;
    }

    .signup-box h2 {
      font-size: 24px;
      margin-bottom: 15px;
      color: #1B1F3B;
      font-weight: 700;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      display: none;
      font-weight: 500;
    }

    .success {
      background-color: #D4FFE6;
      color: #1B5E20;
      display: block;
    }

    .error {
      background-color: #FFE1E1;
      color: #B71C1C;
      display: block;
    }

  </style>
</head>

<body>

  <img src="images/bms-removebg-preview.png" class="logo" alt="BMSCE LOGO">

  <div class="signup-box">
    <h2>Create Account</h2>

    <form id="signupForm">

      <input type="text" id="name" placeholder="Full Name" required>
      <input type="tel" id="phone" placeholder="Phone Number" required>
      <input type="email" id="email" placeholder="@bmsce.ac.in Email" required>
      <input type="text" id="usn" placeholder="USN" required>
      <input type="password" id="password" placeholder="Create Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

      <button class="btn btn-primary" style="width: 100%; margin-top: 15px;">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const usn = document.getElementById('usn').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');

      // Password validation
      const strongPassword = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?])[A-Za-z\d!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]{8,}$/;

      if (!strongPassword.test(password) || password.includes(' ')) {
        messageDiv.className = "message error";
        messageDiv.textContent =
          "Password must have: 8+ chars, 1 uppercase, 1 number, 1 special character, no spaces.";
        return;
      }

      if (password !== confirmPassword) {
        messageDiv.className = "message error";
        messageDiv.textContent = "Passwords do not match!";
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone, email, usn, password })
        });

        const data = await response.json();

        if (data.success) {
          messageDiv.className = "message success";
          messageDiv.textContent = "Signup successful! Redirecting...";

          setTimeout(() => {
            window.location.href = "Login.html";
          }, 1500);

        } else {
          messageDiv.className = "message error";
          messageDiv.textContent = data.message;
        }

      } catch (err) {
        messageDiv.className = "message error";
        messageDiv.textContent = "Server error";
      }
    });
  </script>

</body>
</html>
