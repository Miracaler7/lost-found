<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #e9f0ff;
    }
    .login-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 360px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }
    .login-card h2 {
      margin-bottom: 15px;
    }
    .login-card input {
      width: 90%;
      margin: 8px 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<div class="login-card">
  <h2>Admin Login</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="loginAdmin()">
    Login
  </button>
</div>

<script>
function loginAdmin() {
  const u = username.value;
  const p = password.value;

  if (u === "admin" && p === "1234") {
    sessionStorage.setItem("admin", "true");
    window.location.href = "admin.html";
  } else {
    alert("Invalid admin credentials");
  }
}
</script>

</body>
</html>
