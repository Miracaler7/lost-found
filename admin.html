<!DOCTYPE html>
<html>
<head>
  <title>Admin Claims</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="navbar">
    <div>Admin Claims</div>
    <button class="nav-btn" onclick="logout()">Logout</button>
  </div>

  <h2 class="section-title">Pending Claims</h2>
  <div id="claims" class="grid"></div>

  <script>
    async function loadClaims() {
      const res = await fetch("http://localhost:3000/admin/pending-claims");
      const claims = await res.json();
      const c = document.getElementById("claims");
      c.innerHTML = "";

      claims.forEach(cl => {
        c.innerHTML += `
          <div class="item-card">
            <h3>${cl.item_id.item_name}</h3>
            <p>${cl.item_id.location_found}</p>
            <p><b>Email:</b> ${cl.claimant_email}</p>
            <p><b>Phone:</b> ${cl.claimant_phone}</p>
            <p><b>USN:</b> ${cl.claimant_usn}</p>

            <button onclick="approve('${cl._id}')">Approve</button>
            <button onclick="reject('${cl._id}')">Reject</button>
          </div>
        `;
      });
    }

    async function approve(id) {
      await fetch(`http://localhost:3000/admin/approve-claim/${id}`, { method: "POST" });
      loadClaims();
    }

    async function reject(id) {
      await fetch(`http://localhost:3000/admin/reject-claim/${id}`, { method: "DELETE" });
      loadClaims();
    }

    function logout() {
      window.location.href = "UserAdmin.html";
    }

    loadClaims();
  </script>
</body>
</html>
