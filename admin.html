<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <!-- Global Theme -->
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .logo {
            width: 130px;
            margin-bottom: 10px;
        }

        .admin-box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0px 4px 18px rgba(0,0,0,0.12);
            text-align: center;
        }

        .admin-box h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #1B1F3B;
            font-weight: 700;
        }

        .message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            display: none;
            font-weight: 500;
        }

        .success {
            background-color: #D4FFE6;
            color: #1B5E20;
            display: block;
        }

        .error {
            background-color: #FFE1E1;
            color: #B71C1C;
            display: block;
        }
    </style>
</head>

<body>

    <img src="images/bms-removebg-preview.png" class="logo" alt="BMSCE LOGO">

    <div class="admin-box">

        <h2>Admin Login</h2>

        <form id="adminForm">

            <input type="text" id="username" placeholder="Admin Username" required>
            <input type="password" id="password" placeholder="Admin Password" required>

            <button class="btn btn-primary" style="width: 100%; margin-top: 15px;">
                Login as Admin
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>

    <script>
        document.getElementById("adminForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const msg = document.getElementById("message");

            try {
                const response = await fetch("http://localhost:3000/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    msg.className = "message success";
                    msg.textContent = "Admin Login Successful! Redirecting...";

                    setTimeout(() => {
                        window.location.href = "adminpanel.html";
                    }, 1200);

                } else {
                    msg.className = "message error";
                    msg.textContent = data.message;
                }

            } catch (err) {
                msg.className = "message error";
                msg.textContent = "Server Error";
            }
        });
    </script>

</body>
</html>
